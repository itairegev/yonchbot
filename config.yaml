# YonchBot settings - the bot's control panel.
# Change numbers here, save, and run the bot again. No code needed!
#
# All screen positions (x, y) are in PIXELS, counted from the TOP-LEFT
# corner of the screen. Use `python -m yonchbot screenshot` and open the
# picture to measure positions for YOUR device.

device:
  # Leave empty to use the only connected device.
  # If `adb devices` shows several, put the serial number here.
  serial: ""

vision:
  templates_dir: "assets/templates"
  # How sure the bot must be before it believes it found a button (0-1).
  # Session 4 of the mentor guide is all about playing with this number.
  match_threshold: 0.85

match:
  # Where the movement joystick sits. On most phones it's the lower-left.
  # Measure yours! (landscape mode: width ~2400, height ~1080 is common)
  joystick_anchor: [400, 800]
  # Where the attack button sits (lower-right).
  attack_button: [2100, 820]
  # Where the SUPER button (the skull) sits.
  super_button: [1653, 793]
  # How the bot walks: circle, zigzag, bush_camper, or headless_chicken.
  # (Add your own in yonchbot/play.py!)
  pattern: "circle"
  # Football mode: chase the ball and kick it toward the enemy goal (up)!
  football: true
  # The bot's tunable "genes" - `python -m yonchbot evolve` experiments
  # on these BY ITSELF and keeps whatever wins more games:
  kick_range: 220            # how close to the ball before kicking north
  shoot_range: 0.45          # shooting distance, as a slice of screen width
  step_hold_ms: 300          # how long each in-combat step lasts (ms)
  # Where to tap to fix the game mode if something switched it:
  event_banner_spot: [1487, 992]   # the mode banner on the lobby
  football_card_spot: [979, 415]   # the Brawl Ball card in the browser
  joystick_distance: 150     # how far to push the joystick (pixels)
  joystick_hold_ms: 700      # how long each push lasts (milliseconds)
  attack_every_steps: 3      # attack once every N walking steps

timing:
  seconds_between_looks: 0.3   # how often the bot checks the screen

safety:
  max_games: 50                  # never play more than this per run
  give_up_after_unknowns: 25      # stop if confused this many times in a row
                                  # (the death animation alone eats ~10 - with
                                  #  the fast heartbeat, patience is a virtue)
  safe_tap_spot: [700, 600]       # a boring spot that closes popups safely
                                  # (careful: bottom-center is NOT safe - it
                                  #  sits on the lobby's event banner!)
  home_button: [2252, 51]         # the little house, top-right of menus -
                                  # the bot taps it when it's really lost
  spectate_exit_spot: [1216, 999] # where the spectate Exit button lives -
                                  # gas clouds sometimes hide it from the
                                  # template, but it never moves
  stuck_screenshots_dir: "data/stuck"

diary:
  csv_path: "data/games.csv"
  dashboard_path: "data/progress.html"
